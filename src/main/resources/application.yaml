spring:
  application:
    name: jobradar

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${DATABASE_USERNAME:jobradar}
    password: ${DATABASE_PASSWORD:jobradar}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true