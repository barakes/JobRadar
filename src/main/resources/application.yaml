spring:
  application:
    name: jobradar

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${DATABASE_USERNAME:jobradar}
    password: ${DATABASE_PASSWORD:jobradar}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

jobradar:
  admin:
    api-key: ${ADMIN_API_KEY:local-dev-key}
  sync:
    enabled: ${SYNC_ENABLED:true}
    initial-delay: ${SYNC_INITIAL_DELAY:PT30S}
    interval: ${SYNC_INTERVAL:PT6H}