name: Scheduled sync

on:
  schedule:
    # Every 6 hours, at minute 17 (UTC). Not at minute 0, when GitHub is busiest.
    - cron: '17 */6 * * *'
  # Also allows running it manually from the Actions tab.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wake up the server and sync all companies
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 30 --retry-all-errors \
            --max-time 300 \
            -X POST "https://jobradar-3wmg.onrender.com/api/sync" \
            -H "X-Admin-Key: $ADMIN_API_KEY"